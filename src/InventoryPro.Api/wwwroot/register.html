<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - InventoryPro</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Create account</h1>
        <p class="subtitle">New accounts are created with the Staff role.</p>

        <form id="registerForm" novalidate>
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
          </div>
          <button class="btn" type="submit" id="registerButton">Create account</button>
        </form>

        <p class="hint">
          Already registered? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
