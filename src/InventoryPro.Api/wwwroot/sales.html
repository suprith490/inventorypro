<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales - InventoryPro</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="content">
          <div class="page-header">
            <div>
              <h2>Sales / Stock Out</h2>
              <p>Customer sales. The API validates stock and decreases inventory automatically.</p>
            </div>
            <button class="btn" id="addSaleButton">+ Record sale</button>
          </div>

          <form class="filters" id="filterForm">
            <div class="field">
              <label for="search">Search</label>
              <input id="search" type="search" placeholder="SO number, customer or user" />
            </div>
            <div class="field">
              <label for="from">From</label>
              <input id="from" type="date" />
            </div>
            <div class="field">
              <label for="to">To</label>
              <input id="to" type="date" />
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <button class="btn secondary" type="button" id="clearFilters">Clear</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>SO number</th>
                  <th>Customer</th>
                  <th>Sold by</th>
                  <th>Date</th>
                  <th class="text-right">Qty</th>
                  <th class="text-right">Total</th>
                  <th>Status</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="salesBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </main>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/sales.js"></script>
  </body>
</html>
